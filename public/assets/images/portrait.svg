<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Placeholder for a professional portrait photograph">
  <defs>
    <radialGradient id="pkey" cx="38%" cy="26%" r="80%">
      <stop offset="0" stop-color="#302B27"/>
      <stop offset=".55" stop-color="#1B1918"/>
      <stop offset="1" stop-color="#0D0C0B"/>
    </radialGradient>
    <linearGradient id="pfig" x1=".15" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#4E463D"/>
      <stop offset=".5" stop-color="#2A2624"/>
      <stop offset="1" stop-color="#161514"/>
    </linearGradient>
    <linearGradient id="pfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </linearGradient>
    <filter id="pgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="1" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#pkey)"/>

  <g>
    <circle cx="400" cy="362" r="126" fill="url(#pfig)"/>
    <path d="M400 512 c-136 0 -232 88 -252 214 -6 38 -8 78 -8 118 v156 H660 V844 c0 -40 -2 -80 -8 -118 -20 -126 -116 -214 -252 -214 z" fill="url(#pfig)"/>
    <path d="M316 268 a126 126 0 0 1 60 -30 a126 126 0 0 0 -62 156 a126 126 0 0 1 2 -126 z" fill="#fff" opacity=".07"/>
    <path d="M400 512 c-70 0 -126 24 -166 64" stroke="#C4A06A" stroke-opacity=".34" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="800" height="1000" fill="url(#pfade)"/>
  <rect width="800" height="1000" filter="url(#pgrain)" opacity=".05"/>

  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" fill="#F2EEE7" text-anchor="middle">
    <text x="400" y="910" font-size="30" font-weight="600" letter-spacing="7">YOUR PORTRAIT</text>
    <text x="400" y="948" font-size="20" font-weight="400" letter-spacing="1" fill="#8E877F">Replace this file with your photo.</text>
  </g>
</svg>
