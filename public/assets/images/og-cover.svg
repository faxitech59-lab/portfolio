<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Social share cover image">
  <defs>
    <radialGradient id="okey" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#2E2A26"/>
      <stop offset=".55" stop-color="#1A1817"/>
      <stop offset="1" stop-color="#0C0B0B"/>
    </radialGradient>
    <filter id="ograin" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="1" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#okey)"/>
  <rect x="0" y="0" width="6" height="630" fill="#C4A06A" opacity=".8"/>
  <rect width="1200" height="630" filter="url(#ograin)" opacity=".05"/>

  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" fill="#F2EEE7">
    <text x="88" y="250" font-size="74" font-weight="700" letter-spacing="-1">Product advertising</text>
    <text x="88" y="336" font-size="74" font-weight="700" letter-spacing="-1">&amp; creative commercials</text>
    <text x="88" y="416" font-size="26" font-weight="500" letter-spacing="6" fill="#C4A06A">FOOD &#160;&#183;&#160; PET &#160;&#183;&#160; HOME &#160;&#183;&#160; HOUSEHOLD &#160;&#183;&#160; CONSUMER</text>
    <text x="88" y="540" font-size="30" font-weight="600" letter-spacing="4" fill="#8E877F">YOUR NAME</text>
  </g>
</svg>
